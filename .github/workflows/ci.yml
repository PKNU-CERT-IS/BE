name: Backend CI (Build Only)

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  build-only:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) JDK 설치
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3) Gradle 캐싱
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      # 4) Gradlew 권한 추가
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5) 빌드만 실행 (테스트 X)
      - name: Build project
        run: ./gradlew build -x test --stacktrace
