// jOOQ Code Generation Configuration (Official Plugin Syntax)
// 개발용 기본값 사용 (환경변수는 Spring Boot에서 처리)
jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = "jdbc:postgresql://${System.getenv('DB_HOST') ?: 'localhost'}:${System.getenv('DB_PORT') ?: '5432'}/${System.getenv('DB_NAME') ?: 'studyplatform'}"
            user = System.getenv('DB_USERNAME') ?: 'studyplatform'
            password = System.getenv('DB_PASSWORD') ?: 'password'
        }
        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                // PostgreSQL 메타데이터 오류 무시 설정
                includes = '.*'
                excludes = 'auth'  // auth 테이블 제외 (외래키 문제)
                // 외래키 관련 메타데이터 오류 방지
                recordVersionFields = ''
                recordTimestampFields = ''
                // 오류 발생 시 로그만 출력하고 계속 진행
                onError = 'LOG'
                // PostgreSQL 메타데이터 스키마 호환성 설정
                properties {
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                    property {
                        key = 'defaultSchema'
                        value = 'public'
                    }
                    property {
                        key = 'includeSystemTables'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemSchemas'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemIndexes'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemForeignKeys'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemPrimaryKeys'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemUniqueKeys'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemCheckConstraints'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemSequences'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemRoutines'
                        value = 'false'
                    }
                    property {
                        key = 'includeSystemUDTs'
                        value = 'false'
                    }
                    property {
                        key = 'includeIndexes'
                        value = 'false'
                    }
                    property {
                        key = 'includeSequences'
                        value = 'false'
                    }
                    property {
                        key = 'includeRoutines'
                        value = 'false'
                    }
                    property {
                        key = 'includeUDTs'
                        value = 'false'
                    }
                }
            }
            target {
                packageName = 'org.certis.studyplatform.infrastructure.persistence.jooq.generated'
                directory = 'src/main/java'
            }
            generate {
                records = true
                pojos = true
                daos = false
                // 관계형 정보 생성 비활성화 (외래키 오류 방지)
                relations = false
                keys = false
            }
            // 오류 발생 시 경고로 처리하고 계속 진행
            strategy {
                name = 'org.jooq.codegen.DefaultGeneratorStrategy'
            }
        }
    }
}