plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.jooq.jooq-codegen-gradle' version '3.20.1'
}

group = 'org.certis'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    // ✅ 전역적으로 충돌 라이브러리 제외
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'log4j', module: 'log4j'

        // 중복 의존성 해결 전략
        resolutionStrategy {
            // 의존성 충돌 시 최신 버전 사용
            failOnVersionConflict()
            preferProjectModules()

            // 강제 버전 지정
            force(
                    'org.slf4j:slf4j-api:2.0.17',
                    'ch.qos.logback:logback-classic:1.5.18',
                    'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64'
            )
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ✅ Spring Boot Core Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ✅ Spring Security - 선택적 (개발 시 비활성화 가능)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ✅ 데이터베이스 - Embedded PostgreSQL
    implementation('io.zonky.test:embedded-postgres:2.0.7') {
        exclude group: 'org.slf4j'
        exclude group: 'commons-logging'
    }
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ JWT 인증
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ✅ Redis 및 캐싱 - 안정화된 설정
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'redis.clients:jedis'
    implementation('org.redisson:redisson-spring-boot-starter:3.37.0') {
        exclude group: 'commons-logging'
    }

    // ✅ jOOQ (CQRS Query Side)
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.jooq:jooq:3.20.1'
    implementation 'org.jooq:jooq-codegen:3.20.1'

    // ✅ 유틸리티 라이브러리
    implementation('commons-io:commons-io:2.20.0') {
        exclude group: 'commons-logging'
    }
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // ✅ 마크다운 처리 (간소화된 버전)
    implementation('com.vladsch.flexmark:flexmark:0.64.8') {
        exclude group: 'commons-logging'
    }
    implementation('com.vladsch.flexmark:flexmark-ext-tables:0.64.8') {
        exclude group: 'commons-logging'
    }
    implementation('com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:0.64.8') {
        exclude group: 'commons-logging'
    }

    // ✅ API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // ✅ JSON 처리
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    // ✅ MacOS DNS 이슈 해결
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64'

    // ✅ 개발 도구
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ✅ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ✅ jOOQ Code Generation
    jooqCodegen 'org.postgresql:postgresql'
    jooqCodegen 'org.jooq:jooq-codegen:3.20.1'

    // ✅ 테스트 의존성
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation('io.zonky.test:embedded-postgres:2.0.7') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    testImplementation 'it.ozimov:embedded-redis:0.7.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ✅ 테스트 설정
test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// ✅ 환경변수 로딩 태스크
task loadEnv {
    group = 'environment'
    description = 'Load environment variables from .env file'

    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            def envVars = [:]
            envFile.eachLine { line ->
                if (line && !line.startsWith('#') && line.contains('=')) {
                    def (key, value) = line.split('=', 2)
                    envVars[key.trim()] = value.trim()
                    System.setProperty(key.trim(), value.trim())
                }
            }

            bootRun {
                environment envVars
                jvmArgs = ['-Xmx1g', '-Xms512m']
            }

            println '✅ Environment variables loaded from .env file'
        } else {
            println '⚠️  .env file not found - using default values'
        }
    }
}

// ✅ 개발용 태스크들
task setupDev {
    group = 'development'
    description = 'Setup development environment'

    doLast {
        println '🛠️  Development Environment Setup:'
        println '🐘 Database: Embedded PostgreSQL (auto-port from 5433)'
        println '🔴 Redis: In-memory fallback (embedded redis optional)'
        println '🔐 Security: Development mode (auto-generated passwords)'
        println '📖 API Docs: http://localhost:8080/swagger-ui.html'
        println '🔧 Actuator: http://localhost:8080/actuator'
        println '🚀 Run: ./gradlew bootRun'
    }
}

task cleanDev {
    group = 'development'
    description = 'Clean development environment'

    doLast {
        delete 'logs'
        delete 'uploads'
        println '🧹 Development environment cleaned'
    }
}

// ✅ bootRun 최적화
bootRun {
    dependsOn loadEnv
    systemProperty 'spring.profiles.active', 'dev'

    // JVM 최적화
    jvmArgs = [
            '-Xmx1g',
            '-Xms512m',
            '-XX:+UseG1GC',
            '-XX:MaxGCPauseMillis=200',
            '-Dspring.output.ansi.enabled=always'
    ]
}

// ✅ jOOQ Code Generation Configuration - 개발 시에만 필요
// 실제 데이터베이스가 실행 중일 때만 코드 생성 가능
jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = "jdbc:postgresql://${System.getenv('JOOQ_DB_HOST') ?: 'localhost'}:${System.getenv('JOOQ_DB_PORT') ?: '5433'}/${System.getenv('JOOQ_DB_NAME') ?: 'certis_local'}"
            user = System.getenv('JOOQ_DB_USERNAME') ?: 'postgres'
            password = System.getenv('JOOQ_DB_PASSWORD') ?: ''
        }
        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                includes = '.*'
                excludes = 'flyway_schema_history'  // Flyway 테이블 제외
            }
            target {
                packageName = 'org.certis.generated.jooq'
                directory = 'src/main/java'  // ✅ 수정: resources → java
            }
            generate {
                records = true
                pojos = true
                daos = false
                relations = true  // ✅ 추가: 테이블 관계 생성
                keys = true       // ✅ 추가: FK/PK 생성
                sequences = true  // ✅ 추가: 시퀀스 생성
            }
        }
    }
}

// ✅ jOOQ 코드 생성 태스크 추가
task generateJooqCode {
    group = 'jooq'
    description = 'Generate jOOQ code from database schema'
    dependsOn 'jooqCodegen'

    doLast {
        println '✅ jOOQ code generation completed'
        println '📁 Generated files location: src/main/java/org/certis/generated/jooq/'
    }
}

// ✅ 컴파일 전에 jOOQ 코드 생성 (선택적)
// compileJava.dependsOn generateJooqCode

// ✅ 컴파일 최적화
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-deprecation',
            '-Xlint:-processing',
            '-parameters'
    ]
    options.deprecation = false
}

// ✅ JAR 빌드 최적화
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = "${project.name}-${project.version}.jar"
    layered {
        enabled = true
    }
}