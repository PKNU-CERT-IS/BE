plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.jooq.jooq-codegen-gradle' version '3.20.1'
}

group = 'org.certis'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    // ✅ 전역적으로 충돌 라이브러리 제외
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'log4j', module: 'log4j'

        // 중복 의존성 해결 전략
        resolutionStrategy {
            // 의존성 충돌 시 최신 버전 사용
            failOnVersionConflict()
            preferProjectModules()

            // 강제 버전 지정
            force(
                    'org.slf4j:slf4j-api:2.0.17',
                    'ch.qos.logback:logback-classic:1.5.18',
                    'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64'
            )
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ✅ Spring Boot Core Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ✅ Spring Security - 선택적 (개발 시 비활성화 가능)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ✅ 데이터베이스 - Embedded PostgreSQL
    implementation 'io.zonky.test:embedded-postgres:2.0.7'
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ JWT 인증
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ✅ Redis 및 캐싱 - 안정화된 설정
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'redis.clients:jedis'
    implementation('org.redisson:redisson-spring-boot-starter:3.37.0') {
        exclude group: 'commons-logging'
    }
    implementation 'it.ozimov:embedded-redis:0.7.3'

    // ✅ jOOQ (CQRS Query Side)
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.jooq:jooq:3.20.1'
    implementation 'org.jooq:jooq-codegen:3.20.1'

    // ✅ Flyway 의존성 - 운영환경용 마이그레이션
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ✅ 유틸리티 라이브러리
    implementation('commons-io:commons-io:2.20.0') {
        exclude group: 'commons-logging'
    }
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // ✅ 마크다운 처리 (간소화된 버전)
    implementation('com.vladsch.flexmark:flexmark:0.64.8') {
        exclude group: 'commons-logging'
    }
    implementation('com.vladsch.flexmark:flexmark-ext-tables:0.64.8') {
        exclude group: 'commons-logging'
    }
    implementation('com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:0.64.8') {
        exclude group: 'commons-logging'
    }

    // ✅ API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // ✅ JSON 처리
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    // ✅ MacOS DNS 이슈 해결
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64'

    // ✅ 개발 도구
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ✅ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ✅ jOOQ Code Generation
    jooqCodegen 'org.postgresql:postgresql'
    jooqCodegen 'org.jooq:jooq-codegen:3.20.1'
    implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'

    // ✅ 테스트 의존성
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'it.ozimov:embedded-redis:0.7.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// ✅ 테스트 설정
test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// ===================================================================
// ✅ [REFACTORED] Environment & Execution Configuration
// ===================================================================

// ✅ .env 파일을 로드하여 bootRun 태스크에 시스템 속성으로 설정하는 태스크
tasks.register('loadEnv') {
    description = 'Loads environment variables from a .env file based on the active profile.'

    // 현재 활성화된 프로필을 결정 (gradle -Pprofile=dev ... 없으면 'local' 기본값)
    def activeProfile = project.hasProperty('profile') ? project.getProperty('profile') : 'local'
    project.ext.activeProfile = activeProfile // 다른 태스크에서 사용할 수 있도록 저장

    // [FIXED] Groovy 문법에 맞는 switch-case 구문으로 수정
    def envFileName
    switch (activeProfile) {
        case 'dev':
            envFileName = '.env.dev'
            break
        case 'prod':
            envFileName = '.env.prod'
            break
        default:
            envFileName = '.env'
            break
    }

    def envFile = file(envFileName)

    if (envFile.exists()) {
        println "✅ Loading environment variables from '${envFile.name}' for profile '${activeProfile}'"
        envFile.eachLine { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def parts = line.split('=', 2)
                if (parts.length == 2) {
                    def key = parts[0].trim()
                    def value = parts[1].trim()
                    // 따옴표 제거
                    if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                        value = value.substring(1, value.length() - 1)
                    }
                    // bootRun 태스크의 시스템 속성으로 설정
                    tasks.named('bootRun', org.springframework.boot.gradle.tasks.run.BootRun) {
                        systemProperty key, value
                    }
                }
            }
        }
    } else {
        println "⚠️ WARNING: '${envFile.name}' not found. Continuing without it."
    }
}

// ✅ bootRun 태스크 설정
bootRun {
    // 항상 loadEnv 태스크 이후에 실행되도록 설정
    dependsOn 'loadEnv'

    // loadEnv에서 결정한 활성 프로필을 Spring Boot에 전달
    doFirst {
        systemProperty 'spring.profiles.active', project.ext.activeProfile
    }

    // JVM 최적화
    jvmArgs = [
            '-Xmx1g',
            '-Xms512m',
            '-XX:+UseG1GC',
            '-XX:MaxGCPauseMillis=200',
            '-Dspring.output.ansi.enabled=always'
    ]
}

// ✅ 환경별 실행을 위한 편의용 태스크 (type: GradleBuild 로 변경하여 안정성 확보)
task runLocal(type: GradleBuild) {
    group = 'application'
    description = 'Runs the application with the local profile.'
    tasks = ['bootRun']
    startParameter.projectProperties = [profile: 'local']
}

task runDev(type: GradleBuild) {
    group = 'application'
    description = 'Runs the application with the dev profile.'
    tasks = ['bootRun']
    startParameter.projectProperties = [profile: 'dev']
}

task runProd(type: GradleBuild) {
    group = 'application'
    description = 'Runs the application with the prod profile.'
    tasks = ['bootRun']
    startParameter.projectProperties = [profile: 'prod']
}

// ===================================================================
// ✅ Helper & Utility Tasks
// ===================================================================

// ✅ 개발용 태스크들
task setupDev {
    group = 'development'
    description = 'Setup development environment'

    doLast {
        println 'Development Environment Setup:'
        println 'Database: Embedded PostgreSQL or external (check application-*.yml)'
        println 'Redis: Embedded or external (check application-*.yml)'
        println 'API Docs: http://localhost:8080/swagger-ui.html'
        println 'Actuator: http://localhost:8080/actuator'
        println ''
        println 'Run commands:'
        println '  ./gradlew runLocal  - Run with .env and application-local.yml'
        println '  ./gradlew runDev    - Run with .env.dev and application-dev.yml'
        println '  ./gradlew runProd   - Run with .env.prod and application-prod.yml'
        println '  ./gradlew bootRun -Pprofile=<profile> - Run with a specific profile'
    }
}

task cleanDev {
    group = 'development'
    description = 'Clean development environment'

    doLast {
        delete 'logs'
        println 'Development environment cleaned'
    }
}

// ✅ 환경 파일 생성 헬퍼 태스크 (하이브리드 방식에 맞게 수정)
task createEnvFiles {
    group = 'environment'
    description = 'Create template .env files for secrets and environment-specific values.'

    doLast {
        println "This task creates .env files for secrets. Other configurations should be in application-*.yml files."
        // .env (local)
        def localEnv = file('.env')
        if (!localEnv.exists()) {
            localEnv.text = '''# [Local Environment] - 로컬 개발용 민감 정보 및 변수
# Git에 커밋하지 마세요!
DB_PASSWORD=
JWT_SECRET_KEY=cert-is-local-secret-key-very-long-and-secure-for-local-development-only-never-use-in-production
'''
            println 'Created .env file for local environment'
        }

        // .env.dev
        def devEnv = file('.env.dev')
        if (!devEnv.exists()) {
            devEnv.text = '''# [Development Server Environment] - 개발 서버용 민감 정보 및 변수
# Git에 커밋하지 마세요!
DB_PASSWORD=your_dev_db_password
JWT_SECRET_KEY=use-a-secure-random-string-for-dev-environment
'''
            println 'Created .env.dev file for development environment'
        }

        // .env.prod
        def prodEnv = file('.env.prod')
        if (!prodEnv.exists()) {
            prodEnv.text = '''# [Production Environment] - 운영 환경 변수
# 이 파일은 참조용이며, 실제 값은 외부(Docker, K8s 등)에서 주입됩니다.
# Git에 커밋하지 마세요!
DB_URL=
DB_USERNAME=
DB_PASSWORD=
REDIS_HOST=
REDIS_PORT=
JWT_SECRET_KEY=
'''
            println 'Created .env.prod file for production environment'
        }

        println ''
        println 'Environment files created. Edit them with your specific configuration.'
        println 'Remember to add `.env` and `.env.*` to your .gitignore file!'
    }
}


// ===================================================================
// ✅ jOOQ & Build Configuration
// ===================================================================

// ✅ jOOQ Code Generation Configuration - 개발 시에만 필요
jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = "jdbc:postgresql://${System.getenv('JOOQ_DB_HOST') ?: 'localhost'}:${System.getenv('JOOQ_DB_PORT') ?: '5433'}/${System.getenv('JOOQ_DB_NAME') ?: 'postgres'}"
            user = System.getenv('JOOQ_DB_USERNAME') ?: 'postgres'
            password = System.getenv('JOOQ_DB_PASSWORD') ?: ''
        }
        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                includes = '.*'
                excludes = 'flyway_schema_history'
            }
            target {
                packageName = 'org.certis.generated.jooq'
                directory = 'src/main/java'
            }
            generate {
                records = true
                pojos = true
                daos = false
                relations = true
                keys = true
                sequences = true
            }
        }
    }
}

// ✅ jOOQ 코드 생성 태스크 추가
task generateJooqCode {
    group = 'jooq'
    description = 'Generate jOOQ code from database schema'
    dependsOn 'jooqCodegen'

    doLast {
        println 'jOOQ code generation completed'
        println 'Generated files location: src/main/java/org/certis/generated/jooq/'
    }
}

// ✅ 컴파일 최적화
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-deprecation',
            '-Xlint:-processing',
            '-parameters'
    ]
    options.deprecation = false
}

// ✅ JAR 빌드 최적화
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = "${project.name}-${project.version}.jar"
    layered {
        enabled = true
    }
}