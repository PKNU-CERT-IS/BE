plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.jooq.jooq-codegen-gradle' version '3.20.1'
}

group = 'org.certis'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    // ✅ 전역적으로 충돌 라이브러리 제외
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'log4j', module: 'log4j'

        // 중복 의존성 해결 전략
        resolutionStrategy {
            // 의존성 충돌 시 최신 버전 사용
            failOnVersionConflict()
            preferProjectModules()

            // 강제 버전 지정
            force(
                    'org.slf4j:slf4j-api:2.0.17',
                    'ch.qos.logback:logback-classic:1.5.18',
                    'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64'
            )
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ✅ Spring Boot Core Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ✅ Spring Security - 선택적 (개발 시 비활성화 가능)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ✅ 데이터베이스 - Embedded PostgreSQL
    implementation('io.zonky.test:embedded-postgres:2.0.7') {
        exclude group: 'org.slf4j'
        exclude group: 'commons-logging'
    }
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ JWT 인증
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ✅ Redis 및 캐싱 - 안정화된 설정
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'redis.clients:jedis'
    implementation('org.redisson:redisson-spring-boot-starter:3.37.0') {
        exclude group: 'commons-logging'
    }
    implementation 'it.ozimov:embedded-redis:0.7.3'

    // ✅ jOOQ (CQRS Query Side)
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.jooq:jooq:3.20.1'
    implementation 'org.jooq:jooq-codegen:3.20.1'

    // ✅ Flyway 의존성 - 운영환경용 마이그레이션
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ✅ 유틸리티 라이브러리
    implementation('commons-io:commons-io:2.20.0') {
        exclude group: 'commons-logging'
    }
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // ✅ 마크다운 처리 (간소화된 버전)
    implementation('com.vladsch.flexmark:flexmark:0.64.8') {
        exclude group: 'commons-logging'
    }
    implementation('com.vladsch.flexmark:flexmark-ext-tables:0.64.8') {
        exclude group: 'commons-logging'
    }
    implementation('com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:0.64.8') {
        exclude group: 'commons-logging'
    }

    // ✅ API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // ✅ JSON 처리
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    // ✅ MacOS DNS 이슈 해결
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.123.Final:osx-aarch_64'

    // ✅ 개발 도구
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ✅ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ✅ jOOQ Code Generation
    jooqCodegen 'org.postgresql:postgresql'
    jooqCodegen 'org.jooq:jooq-codegen:3.20.1'

    // ✅ 테스트 의존성
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation('io.zonky.test:embedded-postgres:2.0.7') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    testImplementation 'it.ozimov:embedded-redis:0.7.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// ✅ 테스트 설정
test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// ✅ 환경별 .env 파일 로딩 태스크
task loadEnv {
    group = 'environment'
    description = 'Load environment variables from profile-specific .env file'

    doFirst {
        // 프로필 결정 (시스템 프로퍼티 > 환경변수 > 기본값)
        def profile = System.getProperty('spring.profiles.active') 
                   ?: System.getenv('SPRING_PROFILES_ACTIVE') 
                   ?: 'local'

        // 프로필에 따른 .env 파일 결정
        def envFileName = getEnvFileName(profile)
        def envFile = file(envFileName)
        
        println "Active profile: ${profile}"
        println "Loading environment file: ${envFileName}"

        if (envFile.exists()) {
            def envVars = [:]
            envFile.eachLine { line ->
                if (line && !line.startsWith('#') && line.contains('=')) {
                    def parts = line.split('=', 2)
                    if (parts.length == 2) {
                        def key = parts[0].trim()
                        def value = parts[1].trim()
                        
                        // 따옴표 제거
                        if ((value.startsWith('"') && value.endsWith('"')) || 
                            (value.startsWith("'") && value.endsWith("'"))) {
                            value = value[1..-2]
                        }
                        
                        envVars[key] = value
                        System.setProperty(key, value)
                    }
                }
            }

            // bootRun에 환경변수 적용
            bootRun {
                environment envVars
                jvmArgs = ['-Xmx1g', '-Xms512m']
            }

            println "Successfully loaded ${envVars.size()} environment variables from ${envFileName}"
            
            // 주요 설정값 출력 (비밀번호 등은 마스킹)
            if (envVars.containsKey('SPRING_DATASOURCE_URL')) {
                println "Database: ${envVars['SPRING_DATASOURCE_URL']}"
            }
            if (envVars.containsKey('SPRING_DATA_REDIS_HOST')) {
                println "Redis: ${envVars['SPRING_DATA_REDIS_HOST']}:${envVars['SPRING_DATA_REDIS_PORT'] ?: '6379'}"
            }
            
        } else {
            println "WARNING: ${envFileName} file not found"
            println "Continuing with system environment variables and application.yml defaults..."
            
            // 기본 프로필 설정
            System.setProperty('spring.profiles.active', profile)
        }
    }
}

// 프로필에 따른 .env 파일명 결정 함수
def getEnvFileName(String profile) {
    switch (profile) {
        case 'local':
            return '.env'
        case 'dev':
            return '.env.dev'
        case 'prod':
            return '.env.prod'
        default:
            return '.env'
    }
}

// ✅ 환경별 실행 태스크들
task runLocal {
    group = 'environment'
    description = 'Run application with local profile (.env)'
    
    doFirst {
        System.setProperty('spring.profiles.active', 'local')
    }
    
    finalizedBy 'bootRun'
}

task runDev {
    group = 'environment'
    description = 'Run application with dev profile (.env.dev)'
    
    doFirst {
        System.setProperty('spring.profiles.active', 'dev')
    }
    
    finalizedBy 'bootRun'
}

task runProd {
    group = 'environment'
    description = 'Run application with prod profile (.env.prod)'
    
    doFirst {
        System.setProperty('spring.profiles.active', 'prod')
    }
    
    finalizedBy 'bootRun'
}

// ✅ 개발용 태스크들
task setupDev {
    group = 'development'
    description = 'Setup development environment'

    doLast {
        println 'Development Environment Setup:'
        println 'Database: Embedded PostgreSQL (auto-port from 5433)'
        println 'Redis: In-memory fallback (embedded redis optional)'
        println 'Security: Development mode (auto-generated passwords)'
        println 'API Docs: http://localhost:8080/swagger-ui.html'
        println 'Actuator: http://localhost:8080/actuator'
        println ''
        println 'Run commands:'
        println '  ./gradlew runLocal  - Run with .env file'
        println '  ./gradlew runDev    - Run with .env.dev file'  
        println '  ./gradlew runProd   - Run with .env.prod file'
        println '  ./gradlew bootRun   - Run with auto-detected profile'
    }
}

task cleanDev {
    group = 'development'
    description = 'Clean development environment'

    doLast {
        delete 'logs'
        delete 'uploads'
        println 'Development environment cleaned'
    }
}

// ✅ 환경 파일 생성 헬퍼 태스크
task createEnvFiles {
    group = 'environment'
    description = 'Create template .env files for all environments'
    
    doLast {
        // .env (local)
        def localEnv = file('.env')
        if (!localEnv.exists()) {
            localEnv.text = '''# Local Development Environment
SPRING_PROFILES_ACTIVE=local
SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/certis_dev
SPRING_DATASOURCE_USERNAME=postgres
SPRING_DATASOURCE_PASSWORD=postgres
SPRING_DATA_REDIS_HOST=localhost
SPRING_DATA_REDIS_PORT=6379

# Local Settings
APP_MOCK_DATA_ENABLED=true
JWT_SECRET=local-dev-secret-key-12345
LOG_LEVEL_ROOT=DEBUG
'''
            println 'Created .env file for local environment'
        }
        
        // .env.dev
        def devEnv = file('.env.dev')
        if (!devEnv.exists()) {
            devEnv.text = '''# Development Server Environment  
SPRING_PROFILES_ACTIVE=dev
SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql-dev:5432/certis_dev
SPRING_DATASOURCE_USERNAME=postgres
SPRING_DATASOURCE_PASSWORD=postgres
SPRING_DATA_REDIS_HOST=redis-dev
SPRING_DATA_REDIS_PORT=6379

# Dev Settings
APP_MOCK_DATA_ENABLED=false
JWT_SECRET=dev-secret-key-67890
LOG_LEVEL_ROOT=INFO
'''
            println 'Created .env.dev file for development environment'
        }
        
        // .env.prod
        def prodEnv = file('.env.prod')
        if (!prodEnv.exists()) {
            prodEnv.text = '''# Production Environment
SPRING_PROFILES_ACTIVE=prod
SPRING_DATASOURCE_URL=${DATABASE_URL}
SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
SPRING_DATA_REDIS_HOST=${REDIS_HOST}
SPRING_DATA_REDIS_PORT=${REDIS_PORT}

# Prod Settings
APP_MOCK_DATA_ENABLED=false
JWT_SECRET=${JWT_SECRET_KEY}
LOG_LEVEL_ROOT=WARN
'''
            println 'Created .env.prod file for production environment'
        }
        
        println ''
        println 'Environment files created. Edit them with your specific configuration.'
    }
}

// ✅ bootRun 최적화
bootRun {
    dependsOn loadEnv
    
    // 기본 프로필 설정 (loadEnv에서 오버라이드 가능)
    if (!System.getProperty('spring.profiles.active')) {
        systemProperty 'spring.profiles.active', 'local'
    }

    // JVM 최적화
    jvmArgs = [
            '-Xmx1g',
            '-Xms512m',
            '-XX:+UseG1GC',
            '-XX:MaxGCPauseMillis=200',
            '-Dspring.output.ansi.enabled=always'
    ]
}

// ✅ jOOQ Code Generation Configuration - 개발 시에만 필요
jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = "jdbc:postgresql://${System.getenv('JOOQ_DB_HOST') ?: 'localhost'}:${System.getenv('JOOQ_DB_PORT') ?: '5433'}/${System.getenv('JOOQ_DB_NAME') ?: 'certis_local'}"
            user = System.getenv('JOOQ_DB_USERNAME') ?: 'postgres'
            password = System.getenv('JOOQ_DB_PASSWORD') ?: ''
        }
        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                includes = '.*'
                excludes = 'flyway_schema_history'
            }
            target {
                packageName = 'org.certis.generated.jooq'
                directory = 'src/main/java'
            }
            generate {
                records = true
                pojos = true
                daos = false
                relations = true
                keys = true
                sequences = true
            }
        }
    }
}

// ✅ jOOQ 코드 생성 태스크 추가
task generateJooqCode {
    group = 'jooq'
    description = 'Generate jOOQ code from database schema'
    dependsOn 'jooqCodegen'

    doLast {
        println 'jOOQ code generation completed'
        println 'Generated files location: src/main/java/org/certis/generated/jooq/'
    }
}

// ✅ 컴파일 최적화
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-deprecation',
            '-Xlint:-processing',
            '-parameters'
    ]
    options.deprecation = false
}

// ✅ JAR 빌드 최적화
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    archiveFileName = "${project.name}-${project.version}.jar"
    layered {
        enabled = true
    }
}