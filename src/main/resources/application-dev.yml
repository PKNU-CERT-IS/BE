# ===========================================
# CERT-IS Study Platform - 개발서버 환경 설정 (Docker 컨테이너 사용)
# ===========================================

spring:
  # 개발환경 데이터소스 설정 - Docker PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/certis_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 60000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate 개발 설정 - DDL 자동 관리 (Flyway 없음)
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # 개발서버에서도 DDL 자동 관리
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway 설정 - 개발환경에서 repair 허용
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/common # 공통 스키마
      - classpath:db/mock # 로컬/개발용 목 데이터
    clean-disabled: false # 공유 환경이므로 clean 명령어 비활성화
    repair-on-migrate: true # 마이그레이션 시 체크섬 불일치 자동 수정
    validate-on-migrate: false # 개발환경에서는 검증 비활성화

  # SQL 초기화 설정 - 샘플 데이터 삽입
  sql:
    init:
      mode: always

  # Redis 설정 - Docker Redis 사용
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms
      connect-timeout: 5000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms

certis:
  idempotency:
    board:
      enabled: false
    study:
      enabled: false
    project:
      enabled: false
  redis:
    dev-schedule:
      enabled: true
  board:
    dev-schedule:
      enabled: true

  # 캐시 설정 - Redis 사용 (실패 시 메모리 캐시로 fallback)
  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5분

  # Spring Security 개발 설정
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN,USER

  # 개발 도구 설정
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      exclude: static/**,public/**
    livereload:
      enabled: true
      port: 35729

# 개발환경 로깅 설정 - Redis 연결 문제 디버깅
logging:
  level:
    root: INFO
    org.certis.studyplatform: DEBUG
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

    # 캐시 관련 로그 (Redis 문제 디버깅용)
    org.springframework.cache: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.data.redis.connection: DEBUG
    org.springframework.data.redis.core: INFO

    org.springframework.transaction: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: DEBUG
    com.zaxxer.hikari: DEBUG

    # Redis 연결 디버깅
    io.lettuce.core: DEBUG
    io.netty: WARN

# Management/Actuator 개발 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,threaddump,scheduledtasks,beans,conditions
  endpoint:
    health:
      show-details: always
      show-components: always
    env:
      show-values: always

# 개발환경 애플리케이션 설정
app:
  async:
    cpu-bound:
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 100
    background:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 200
    timeout:
      default: 45
      long-running: 300
      background: 600

  jwt:
    secret: cert-is-dev-secret-key-very-long-and-secure-for-development-only
    access-token-expiry: 3600000
    refresh-token-expiry: 86400000

  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081"

  file:
    upload-dir: ./uploads
    max-size: 10MB

  cache:
    default-ttl: 300
    user-ttl: 600
    post-ttl: 300

  monitoring:
    metrics:
      custom-tags:
        environment: dev

  mock-data:
    enabled: true
    sql-init-mode: always

  flyway:
    auto-clean: true
    clean-on-startup: true

# Embedded 서비스 설정 - Docker 사용하므로 비활성화
embedded:
  postgres:
    enabled: false # Docker PostgreSQL 사용
  redis:
    enabled: false # Docker Redis 사용 (실패 시 fallback으로 true 설정 가능)

# API 문서 활성화
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
