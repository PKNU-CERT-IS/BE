spring:
  config:
    activate:
      on-profile: embedded

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway가 스키마 관리하므로 validate만 수행
    show-sql: true
    format-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # ✅ SQL 초기화 설정 - Flyway 사용으로 비활성화
  sql:
    init:
      mode: never # Flyway가 모든 DB 초기화를 담당

  # ✅ Flyway 설정 (embedded 환경용)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: false # 개발 환경에서는 clean 허용
    group: true

logging:
  level:
    org.certis.studyplatform: DEBUG
    org.hibernate.SQL: DEBUG
    io.zonky.test.db.postgres: INFO
    org.springframework.jdbc.datasource.init: DEBUG
    org.flywaydb.core: DEBUG
