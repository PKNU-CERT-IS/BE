spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:certis_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 30000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: false # Redis Cloud SSL 비활성화
      timeout: 5000ms # Redis Cloud 권장 타임아웃
      connect-timeout: 10000ms # Redis Cloud 권장 연결 타임아웃
      database: 0
      lettuce:
        pool:
          max-active: 50 # Redis Cloud 권장 연결 수
          max-idle: 15 # 유휴 연결 수
          min-idle: 10 # 최소 유휴 연결 수
          max-wait: 2000ms # 연결 대기 시간
        shutdown-timeout: 5000ms # 종료 타임아웃

logging:
  level:
    root: WARN
    org.certis.studyplatform: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  mock-data:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600000
    refresh-token-expiry: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.cert-is.com,https://cert-is.com,https://api.cert-is.com}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Content-Type,Authorization,X-Requested-With,Accept,Origin,X-CSRF-TOKEN
    allow-credentials: true
    max-age: 86400
embedded:
  postgres:
    enabled: false
  redis:
    enabled: false

server:
  forward-headers-strategy: native
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
