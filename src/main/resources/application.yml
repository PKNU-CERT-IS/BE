# ===========================================
# CERT-IS Study Platform - 공통 설정
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    context-path: /
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
  shutdown: graceful

spring:
  # ✅ 프로파일 설정
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ✅ 애플리케이션 정보
  application:
    name: cert-is-study-platform

  # ✅ 기본 데이터소스 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CertisHikariPool
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      auto-commit: false
      connection-test-query: SELECT 1
      register-mbeans: true
      allow-pool-suspension: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ✅ JPA/Hibernate 공통 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 25
          batch_versioned_data: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          provider_disables_autocommit: true
        transaction:
          jta:
            platform: none
        temp:
          use_jdbc_metadata_defaults: false

  # ✅ SQL 초기화 기본 설정
  sql:
    init:
      separator: ";"
      continue-on-error: true
      encoding: utf-8

  # ✅ 기본 캐시 설정
  cache:
    cache-names: users,posts,comments,sessions
    simple:
      spec: maximumSize=1000,expireAfterWrite=10m

  # ✅ 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:10MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:50MB}
      location: ${FILE_TEMP_DIR:${java.io.tmpdir}}

  # ✅ Jackson 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
      accept-empty-string-as-null-object: true
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS

  # ✅ 메시지 설정
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ✅ 트랜잭션 설정
  transaction:
    default-timeout: 30
    rollback-on-commit-failure: true

  # ✅ 태스크 실행 설정
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: "async-task-"
      shutdown:
        await-termination: true
        await-termination-period: 20s

# ✅ 기본 로깅 설정
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ${LOG_FILE:logs/application.log}
  level:
    # 공통 로그 레벨
    org.springframework.jcl: ERROR
    org.apache.commons.logging: ERROR
    io.netty.resolver.dns: ERROR
    io.netty.resolver.dns.DnsServerAddressStreamProviders: ERROR
    org.hibernate.engine.transaction.jta.platform.internal.JtaPlatformInitiator: ERROR
    jdk.internal.misc: WARN
    com.vladsch.flexmark: WARN
    org.jooq: WARN

# ✅ Management/Actuator 공통 설정
management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      show-components: when-authorized
    info:
      enabled: true
    metrics:
      enabled: true
    threaddump:
      enabled: true
    scheduledtasks:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full
  metrics:
    export:
      simple:
        enabled: true
    enable:
      jvm: true
      process: true
      system: true
      executor: true
      hikaricp: true

# ✅ 애플리케이션 공통 커스텀 설정
app:
  # JWT 기본 설정
  jwt:
    issuer: cert-is-platform

  # CORS 기본 설정
  cors:
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # 파일 업로드 기본 설정
  file:
    allowed-types: ${FILE_ALLOWED_TYPES:jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx}

  # 성능 모니터링 설정
  monitoring:
    performance:
      enabled: ${MONITORING_PERFORMANCE_ENABLED:true}
      slow-query-threshold: ${MONITORING_SLOW_QUERY:1000}
      slow-request-threshold: ${MONITORING_SLOW_REQUEST:2000}
    metrics:
      enabled: ${MONITORING_METRICS_ENABLED:true}
      custom-tags:
        service: cert-is-platform

# ✅ JWT 설정 (하위 호환성)
jwt:
  secret: ${JWT_SECRET:cert-is-dev-secret-key-very-long-and-secure-for-development-only}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRY:86400000}

# ✅ Swagger/OpenAPI 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: swagger-ui.html
    display-request-duration: true
    display-operation-id: true
  show-actuator: true