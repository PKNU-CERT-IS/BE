# ===========================================
# CERT-IS 통합 애플리케이션 설정
# 환경변수를 통한 설정 관리
# ===========================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # ✅ 데이터소스 설정 - 환경변수 기반
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS:org.postgresql.Driver}
    url: ${DB_URL:jdbc:postgresql://localhost:5433/certis_local}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ✅ JPA 설정 - 환경변수 기반
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} # update: 테이블 구조 변경만 반영, 데이터 유지
    show-sql: ${JPA_SHOW_SQL:true}
    format-sql: ${JPA_FORMAT_SQL:true}
    defer-datasource-initialization: ${JPA_DEFER_DATASOURCE_INIT:true} # JPA 테이블 생성 후 데이터 삽입
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ✅ SQL 초기화 설정 - DatabaseInitializationService로 대체
  sql:
    init:
      mode: always # DatabaseInitializationService에서 트랜잭션 기반으로 처리
      separator: ";"
      continue-on-error: false
      encoding: utf-8

  # ✅ 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:10MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:50MB}

  # ✅ 개발 도구 설정
  devtools:
    restart:
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:true}
    livereload:
      enabled: true

  # ✅ Jackson 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

# ✅ 로깅 설정 - 환경변수 기반
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.certis.studyplatform: ${LOG_LEVEL_CERTIS:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_HIBERNATE_BINDER:TRACE}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ✅ 애플리케이션 커스텀 설정
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: ${FILE_MAX_SIZE:10MB}

# ✅ JWT 설정 - JwtTokenProvider와 호환
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRY:86400000}

# ✅ Management 엔드포인트 설정
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when-authorized}
