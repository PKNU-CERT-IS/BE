spring:
  config:
    activate:
      on-profile: test


  datasource:
    # 테스트에서 트랜잭션 제어를 위한 설정
    hikari:
      auto-commit: false  # autoCommit 비활성화하여 트랜잭션 제어 가능하게 함
      connection-timeout: 20000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: false # 테스트 시 로그 최소화
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          autocommit: false  # Hibernate 레벨에서도 autoCommit 비활성화

  sql:
    init:
      mode: never # 테스트에서는 SQL 초기화 비활성화

  # Redis 설정 (EmbeddedRedis 사용)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 캐시 비활성화
  cache:
    type: none

# 애플리케이션 설정
app:
  jwt:
    secret: test-secret-key-for-testing-only
    access-token-expiry: 3600000
    refresh-token-expiry: 86400000
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
  file:
    upload-dir: ./test-uploads
    max-size: 10MB

# Embedded PostgreSQL 설정
spring.datasource.embedded.enabled: true

# 로깅 설정 (트랜잭션 디버깅을 위한 설정)
logging:
  level:
    org.certis.studyplatform: WARN
    org.springframework.transaction: DEBUG
    org.hibernate.engine.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate: WARN
    io.zonky.test.db.postgres: WARN
    org.springframework: WARN
    root: WARN

# 환경변수 설정 (테스트에서는 SQL 초기화 비활성화)
SQL_INIT_MODE: never

# Management 비활성화
management:
  endpoints:
    enabled-by-default: false

# Embedded servers for testing
embedded:
  redis:
    enabled: true
    port: 6379
