spring:
  config:
    activate:
      on-profile: test

  datasource:
    hikari:
      auto-commit: false
      connection-timeout: 60000
      maximum-pool-size: 5 # 증가
      minimum-idle: 2 # 증가
      validation-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          autocommit: false
    defer-datasource-initialization: false # false로 변경

  sql:
    init:
      mode: never

  flyway:
    enabled: false
    locations: classpath:db/migration/common
    baseline-on-migrate: true
    clean-disabled: false # 테스트에서는 clean 허용

  # 캐시 비활성화
  cache:
    type: none

# 애플리케이션 설정
app:
  jwt:
    secret: test-secret-key-for-testing-only-must-be-at-least-32-characters-long
    access-token-expiry: 3600000
    refresh-token-expiry: 86400000
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
  file:
    upload-dir: ./test-uploads
    max-size: 10MB

# AWS 설정
aws:
  access-key-id: test-key
  secret-access-key: test-secret
  region: ap-northeast-2
  s3:
    bucket: test-bucket

# 로깅 설정
logging:
  level:
    org.certis.studyplatform: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.test.context.cache: DEBUG # Context 캐시 관련 로그 추가
    org.springframework.boot.test.context: DEBUG # 테스트 컨텍스트 로그 추가
    org.hibernate: WARN
    io.zonky.test.db.postgres: INFO # Embedded Postgres 로그 보기
    org.flywaydb: INFO # Flyway 로그 보기
    org.springframework: WARN
    root: WARN

# Management 비활성화
management:
  endpoints:
    enabled-by-default: false

# Redis 데이터 저장소 비활성화
spring.data.redis.repositories.enabled: false
